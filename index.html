
<!DOCTYPE html>
<html lang="pt-AO" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Settings for Native Feel -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="Mais Palma">
    <meta name="apple-mobile-web-app-title" content="Mais Palma">
    <meta name="msapplication-starturl" content="/">
    
    <title>Mais Palma Manager</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="https://i.postimg.cc/6q6K9xSV/Imagotipo_V_2.png" type="image/png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/6q6K9xSV/Imagotipo_V_2.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Service Worker Registration for Offline Capability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered with scope:', registration.scope);
              // Force update if a new SW is found
              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
            })
            .catch(error => {
              console.log('SW registration failed:', error);
            });
        });
      }

      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new Event('installable'));
      });

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                50: '#FAFAFA',   /* Mais Branco */
                100: '#F5F5F5',
                200: '#E5E5E5',
              },
              brand: {
                black: '#211D49',   
                dark: '#1A173B',    
                yellow: '#F3A421',  
                gold: '#D98E15',    
                gray: '#F9FAFB',   
                text: '#211D49',    
                muted: '#9CA3AF',   /* Cinza mais suave */
                border: '#F3F4F6',
                light: '#FFFFFF'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'soft': '0 8px 30px rgba(0, 0, 0, 0.04)', /* Sombra muito mais suave e difusa */
              'glow': '0 0 20px rgba(243, 164, 33, 0.2)',
              'card': '0 4px 12px rgba(0, 0, 0, 0.03)'
            },
            backgroundImage: {
              'gradient-premium': 'linear-gradient(135deg, #F3A421 0%, #F5B045 100%)', 
              'gradient-dark': 'radial-gradient(circle at top right, #2F2A5F 0%, #211D49 60%)',
              'gradient-light': 'linear-gradient(to bottom, #FFFFFF 0%, #FAFAFA 100%)', /* Quase imperceptível */
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Premium White Mode */
        --bg-main: #FFFFFF;      
        --bg-card: #FFFFFF;      
        --bg-input: #FAFAFA;     
        --text-main: #211D49; 
        --text-muted: #9CA3AF;
        --primary: #F3A421;      
        --border: #F3F4F6;
        
        --shadow-soft: 0 10px 40px -10px rgba(0, 0, 0, 0.05);
        --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
      }

      .dark {
        /* Premium Dark Mode - Retained for compatibility */
        --bg-main: #1A173B;      
        --bg-card: #211D49;      
        --bg-input: #2A2655;     
        --text-main: #FAFAFA;    
        --text-muted: #A1A1AA;   
        --primary: #F3A421;      
        --border: rgba(255, 255, 255, 0.06);
        --shadow-soft: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      }

      body { 
        font-family: 'Inter', sans-serif; 
        background-color: var(--bg-main); 
        color: var(--text-main); 
        transition: background-color 0.4s ease, color 0.4s ease;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Disable pull-to-refresh on mobile to feel native */
        overscroll-behavior-y: none;
      }
      
      .dark body {
        background-image: var(--gradient-dark);
        background-attachment: fixed;
      }

      .light body {
        background-image: none; /* Removed gradient for cleaner white look */
        background-color: #FFFFFF;
      }
      
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; }
      input::-webkit-calendar-picker-indicator { display: none !important; }

      .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",

    "jspdf": "https://esm.sh/jspdf@^4.0.0"
  }
}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
