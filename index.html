
<!DOCTYPE html>
<html lang="pt-AO" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA: Remover interface de navegador -->
    <meta name="theme-color" content="#F3F4F6" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="Mais Palma">
    <meta name="apple-mobile-web-app-title" content="Mais Palma">
    <meta name="msapplication-navbutton-color" content="#F3F4F6">
    <meta name="msapplication-starturl" content="/">
    
    <title>Mais Palma Manager</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="https://i.postimg.cc/6q6K9xSV/Imagotipo_V_2.png" type="image/png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/6q6K9xSV/Imagotipo_V_2.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Registro agressivo do Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('SW Registrado:', reg.scope))
            .catch(err => console.log('SW Falha:', err));
        });
      }

      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
      });

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                black: '#211D49',   
                dark: '#1A173B',    
                yellow: '#F3A421',  
                gold: '#D98E15',    
                gray: '#F9FAFB',   
                text: '#211D49',    
                muted: '#9CA3AF',
                border: '#F3F4F6',
                light: '#FFFFFF'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'soft': '0 8px 30px rgba(0, 0, 0, 0.04)',
              'glow': '0 0 20px rgba(243, 164, 33, 0.2)',
              'card': '0 4px 12px rgba(0, 0, 0, 0.03)'
            },
            backgroundImage: {
              'gradient-premium': 'linear-gradient(135deg, #F3A421 0%, #F5B045 100%)', 
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #FFFFFF;      
        --text-main: #211D49; 
        --primary: #F3A421;      
      }

      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #F3F4F6;
        color: var(--text-main); 
        /* Remove o efeito elástico do navegador */
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Esconde barra de rolagem mas mantém funcionalidade */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      
      .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "jspdf": "https://esm.sh/jspdf@^4.0.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
